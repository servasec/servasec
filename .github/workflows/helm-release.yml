name: Helm Chart

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint Helm chart
        run: |
          helm lint deploy/helm/servasec

      - name: Package Helm chart
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/servasec \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination /tmp/helm-chart

      - name: Push to OCI registry
        run: |
          helm push /tmp/helm-chart/servasec-*.tgz \
            oci://ghcr.io/${{ github.repository }}/helm
