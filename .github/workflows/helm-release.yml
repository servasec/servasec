name: Helm Chart

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      chart_version:
        description: "Chart version to publish for a chart-only fix (e.g. 2.4.1). Required on manual runs."
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GitLab Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.gitlab.com
          username: ${{ secrets.GITLAB_REGISTRY_USERNAME }}
          password: ${{ secrets.GITLAB_REGISTRY_PASSWORD }}

      - name: Log in to Helm registry
        run: |
          echo "${{ secrets.GITLAB_REGISTRY_PASSWORD }}" | helm registry login registry.gitlab.com \
            --username "${{ secrets.GITLAB_REGISTRY_USERNAME }}" \
            --password-stdin

      - name: Lint Helm chart
        run: |
          helm lint deploy/helm/servasec

      - name: Package Helm chart
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_CHART_VERSION: ${{ inputs.chart_version }}
        run: |
          APP_VERSION="$(awk -F': ' '/^appVersion:/{print $2}' deploy/helm/servasec/Chart.yaml | tr -d '"')"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "$MANUAL_CHART_VERSION" ]; then
              echo "::error::chart_version input is required for manual (workflow_dispatch) publish"
              exit 1
            fi
            CHART_VERSION="$MANUAL_CHART_VERSION"
          else
            CHART_VERSION="${GITHUB_REF_NAME#v}"
          fi
          helm package deploy/helm/servasec \
            --version "$CHART_VERSION" \
            --app-version "$APP_VERSION" \
            --destination /tmp/helm-chart

      - name: Push to OCI registry
        run: |
          helm push /tmp/helm-chart/servasec-*.tgz \
            oci://registry.gitlab.com/${{ github.repository }}/helm
